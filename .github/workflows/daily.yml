name: Daily Job Agent Pipeline

on:
  # schedule disabled (using Windows Task Scheduler)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-job-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite Database Cache
        uses: actions/cache@v4
        with:
          path: |
            jobs.db
            job_tracker.xlsx
          key: job-agent-state-${{ github.run_number }}
          restore-keys: |
            job-agent-state-

      - name: Load Environment & Candidate Profile Secrets
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
          PROFILE_SECRET: ${{ secrets.CANDIDATE_PROFILE }}
        run: |
          if [ -n "$ENV_SECRET" ]; then
            printf "%s\n" "$ENV_SECRET" > .env
          elif [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -n "$PROFILE_SECRET" ]; then
            printf "%s\n" "$PROFILE_SECRET" > candidate_profile.txt
          elif [ ! -f candidate_profile.txt ] && [ -f candidate_profile.example.txt ]; then
            cp candidate_profile.example.txt candidate_profile.txt
          fi

      - name: Run Unit Verification Suite
        run: python test_units.py

      - name: Refresh ATS Source Registry
        run: python ats_finder.py

      - name: Run Main Job Agent Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python job_agent.py

      - name: Auto-Commit Updated Source Registries
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Auto-Sync"
          git add dynamic_feeds.json github_sources_registry.json
          git diff --staged --quiet || git commit -m "chore(sync): update ATS source registries"
          git push
